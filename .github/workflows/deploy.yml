name: Esteira de Entrega Profissional

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir-e-auditar:
    name: Construir e auditar o site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Auditar a qualidade do site
        run: |
          set -eu
          test -f index.html
          test -f quem-somos.html
          test -f contato.html
          test -f style.css
          test -f assets/ilustracao.svg

          for pagina in index.html quem-somos.html contato.html; do
            grep -q 'href="style.css"' "$pagina"
            grep -q 'href="index.html"' "$pagina"
          done

          grep -q 'src="assets/ilustracao.svg"' index.html
          grep -q 'src="assets/ilustracao.svg"' quem-somos.html
          echo "Auditoria de qualidade aprovada."

      - name: Criar pacote de distribuição
        run: |
          mkdir pacote
          cp index.html quem-somos.html contato.html style.css pacote/
          cp -r assets pacote/
          echo "Conteúdo do pacote:"
          find pacote -maxdepth 2 -type f

      - name: Disponibilizar pacote de distribuição
        uses: actions/upload-artifact@v4
        with:
          name: site-estatico
          path: pacote/
          if-no-files-found: error
